    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('lnr Studio PWA ServiceWorker active');
            // A new build is waiting: activate it, then reload once so the
            // installed app shows the newest version instead of a stale cache.
            reg.addEventListener('updatefound', () => {
              const sw = reg.installing;
              if (!sw) return;
              sw.addEventListener('statechange', () => {
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  sw.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          }).catch((err) => {
            console.warn('SW registration:', err);
          });

          // A controllerchange on the FIRST install is not an update: the worker
          // has merely claimed a page that was never controlled. Reloading there
          // threw away the freshly booted app (and any speech it had queued) for
          // no reason. Only reload when a previous build was replaced.
          let hadController = !!navigator.serviceWorker.controller;
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) {
              hadController = true;
              return;
            }
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
        });
      }
    </script>
    <!-- Shared GA4 helper (gtag is already loaded above). Tracks only existing
         buttons; never ships emails, licence keys, names or file contents. -->
    <script type="module">
      import '/src/analytics.ts';
      (function () {
        function track() {
          if (typeof window.LNR_TRACK === 'function') {
            window.LNR_TRACK.apply(window.LNR_TRACK, arguments);
          }
        }

        function trackUpgrade(location) {
          track('upgrade_click', { location: location });
        }

        // Existing Hub-page upgrade / Pro surfaces.
        document.addEventListener('click', function (e) {
          var t = e.target;
          var link = t && (t.closest('#pricingProBtn') || t.closest('#pricingFreeBtn'));
          if (link) {
            var loc = link.id === 'pricingProBtn' ? 'pricing_pro_btn' : 'pricing_free_btn';
            trackUpgrade(loc);
          }
          if (t && t.id === 'homeGoStudioBtn') {
            trackUpgrade('home_start_studio');
          }
        });

        // Existing Selar checkout surface (Pro purchase path).
        // The canonical Selar link is the Pro checkout URL used everywhere in the app;
        // track it where the existing app opens it (engine.js / pro-gate).
      })();
    </script>
  </body>
