<!doctype html>
<html lang="en">
  <head>
    <!-- Google Analytics 4. External file rather than an inline block so the
         site can enforce a script-src that allows no inline JavaScript. -->
    <script src="/analytics-boot.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1210" />
    <meta name="color-scheme" content="dark" />

    <!-- Brand faces. Linked here rather than @import-ed from a stylesheet:
         Tailwind expands into rules before any later @import, and a browser
         discards an @import that follows a rule — so the build dropped it and
         DM Sans / Manrope never loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@400;500;600;700;800;900&display=swap" />

    <title>LNR Storytelling Hub &mdash; Live Broadcast Studio on Your Phone</title>
    <meta name="description" content="One phone, four broadcast engines: live interactive quiz, Guess-the-Player cards, documentary storytelling, and 24/7 video loop. Zero server bill, free to start, Pro adds partner break clips and a signed licence key. Run it from your phone and screen-cast to YouTube." />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Link previews (X, WhatsApp, Discord, Slack, Messenger, iMessage).
         Every URL here is ABSOLUTE and filled in at build time from
         VITE_SITE_URL / the Vercel host, because a preview service fetches the
         image from its own network — a relative path resolves against the
         wrong host and the card renders with no picture. -->
    <meta property="og:site_name" content="LNR Storytelling Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="LNR Storytelling Hub &mdash; Live Broadcast Studio on Your Phone" />
    <meta property="og:description" content="Four broadcast engines from one phone: live quiz, Guess-the-Player cards, documentary storytelling, and a 24/7 video loop. Free to start, Pro adds partner break clips and a signed licence key." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="lnr Studio: &quot;Turn your sports channel into a game show&quot; beside a mock Guess-the-Player screen showing a mystery kit and a Chelsea clue. Free. No signup." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lnrstudio" />
    <meta name="twitter:title" content="LNR Storytelling Hub &mdash; Live Broadcast Studio on Your Phone" />
    <meta name="twitter:description" content="Four broadcast engines from one phone: live quiz, Guess-the-Player cards, documentary storytelling, and a 24/7 video loop. Free to start, Pro adds partner break clips and a signed licence key." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="lnr Studio: &quot;Turn your sports channel into a game show&quot; beside a mock Guess-the-Player screen showing a mystery kit and a Chelsea clue. Free. No signup." />
    <!-- Some chat clients (WhatsApp, Telegram) read these instead of og:*. -->
    <meta itemprop="name" content="LNR Storytelling Hub" />
    <meta itemprop="description" content="Run Guess-the-Player, trivia and live audience challenges on your stream. Free, no signup." />
    <meta itemprop="image" content="__SITE_URL__/og-image.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LNR Studio" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Structured data. Two graphs: the app itself (so a search or answer
         engine can describe what the site IS) and a FAQ block (so the common
         questions can be quoted directly). Every URL is absolute and filled in
         at build time, like the og:* tags above. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "__SITE_URL__/#app",
          "name": "LNR Storytelling Hub",
          "alternateName": "lnr Studio",
          "url": "__SITE_URL__/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Any (web browser, installable PWA)",
          "description": "A phone-first live broadcast studio. One browser tab runs four broadcast engines — a live interactive quiz, a Guess-the-Player card round, a documentary storytelling engine, and a 24/7 video loop — and the operator screen-casts it to YouTube.",
          "image": "__SITE_URL__/og-image.png",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Free tier: 5 hours of airtime per calendar day. Pro adds unlimited airtime, partner break clips and a signed licence key."
          },
          "featureList": [
            "Live interactive quiz engine with TTS voice reader",
            "Guess-the-Player trivia cards",
            "Documentary storytelling engine",
            "24/7 video loop engine",
            "Stream-safe clean capture mode",
            "Installable PWA, works offline"
          ]
        },
        {
          "@type": "Organization",
          "@id": "__SITE_URL__/#org",
          "name": "LNR Storytelling Hub",
          "url": "__SITE_URL__/",
          "logo": "__SITE_URL__/pwa-512x512.png",
          "sameAs": [
            "https://github.com/lnrstrokes/Lnr-storytelling-hub",
            "https://x.com/lnrstudio"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "__SITE_URL__/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is LNR Storytelling Hub?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "LNR Storytelling Hub is a browser-based live broadcast studio. It runs four engines from one tab — a live interactive quiz, a Guess-the-Player card round, a documentary storytelling engine, and a 24/7 video loop — and the operator screen-casts the result to YouTube. It needs no signup and no server."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need to install anything to use it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. It runs in any modern browser. It can optionally be installed as a PWA so it opens full-screen and works offline once loaded."
              }
            },
            {
              "@type": "Question",
              "name": "Is it free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. The free tier gives 5 hours of airtime per calendar day, enforced server-side. Pro removes the airtime limit and adds partner break clips and a signed licence key."
              }
            },
            {
              "@type": "Question",
              "name": "Where is my content stored?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "On your own device, in the browser's IndexedDB. There are no user accounts and no content is uploaded to a server."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/sw-register.js"></script>
    <!-- Shared GA4 helper (gtag is loaded above). Tracks only existing buttons;
         never ships emails, licence keys, names or file contents. -->
    <script type="module" src="/src/analytics-entry.ts"></script>
  </body>
</html>
