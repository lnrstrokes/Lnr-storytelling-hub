<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#24190c"/>
      <stop offset="50%" stop-color="#0c121a"/>
      <stop offset="100%" stop-color="#04070b"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996e23"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Outer Pulse Rings (Livestream Broadcast signal) -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="14 12" opacity="0.35"/>
  <circle cx="256" cy="230" r="105" fill="none" stroke="#d4af37" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Central Glow Symbol -->
  <circle cx="256" cy="230" r="70" fill="#1b2533" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Broadcast Signal / Lightning Core -->
  <path d="M268 180 L234 235 L260 235 L244 285 L288 225 L262 225 Z" fill="url(#goldGrad)"/>

  <!-- Brand Typography: lnr STUDIO -->
  <text x="256" y="375" text-anchor="middle" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">
    lnr
  </text>
  <text x="256" y="415" text-anchor="middle" font-family="'Manrope', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="20" fill="#d4af37" letter-spacing="8">
    STUDIO
  </text>
</svg>
