name: Apply livestream fixes
on:
  workflow_dispatch:
    inputs:
      patch_url:
        description: URL of the unified diff to apply
        required: true
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch patch
        run: |
          set -euo pipefail
          curl -fsLL -o /tmp/lnr-fixes.patch "${{ inputs.patch_url }}"
          wc -c /tmp/lnr-fixes.patch
          head -2 /tmp/lnr-fixes.patch
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --verbose --whitespace=nowarn /tmp/lnr-fixes.patch
      - name: Verify
        run: |
          set -euo pipefail
          node --check src/timer/engine.js
          grep -q "lnr_stream_bed" src/timer/engine.js
          grep -q "startSynthBed" src/timer/engine.js
          grep -q "promoFunnel" src/timer/timer.html
          grep -q "showBreakNotice" src/timer/video-breaks.ts
          grep -q "lnr-storytelling-hub.vercel.app" index.html
          echo "--- all anchors verified ---"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "lnrstrokes"
          git config user.email "lnrstrokes@gmail.com"
          git rm -q lnr-fixes.patch || true
          git rm -q .github/workflows/lnr-apply-fixes.yml
          git add -A
          git commit -m "Fix speech punctuation, MP3 playback, synth music bed, premium visuals, break notices and promo funnel"
          git push
