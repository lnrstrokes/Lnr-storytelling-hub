name: Apply livestream fixes
on:
  workflow_dispatch:
    inputs:
      patch_url:
        description: URL of the unified diff to apply
        required: true
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch patch
        run: |
          set -euo pipefail
          curl -fsLL -o /tmp/lnr-fixes.patch "${{ inputs.patch_url }}"
          wc -c /tmp/lnr-fixes.patch
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --verbose --whitespace=nowarn /tmp/lnr-fixes.patch
      - name: Verify
        run: |
          set -euo pipefail
          node --check src/timer/engine.js
          grep -q "m.replace(/\\\\./g" src/timer/engine.js
          echo "--- anchors verified ---"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "lnrstrokes"
          git config user.email "lnrstrokes@gmail.com"
          git rm -q .github/workflows/lnr-apply-fixes.yml
          git add -A
          git commit -m "Fix narration chunker: mask every period inside abbreviations"
          git push
