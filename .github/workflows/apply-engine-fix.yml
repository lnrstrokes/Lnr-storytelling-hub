name: Apply engine promo gate

on:
  push:
    branches: [main]
    paths:
      - .github/engine-fix.cjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply the seven engine anchors
        run: node .github/engine-fix.cjs

      - name: Commit the patched engine and remove this one-shot tooling
        run: |
          rm -f .github/engine-fix.cjs .github/workflows/apply-engine-fix.yml
          if git diff --quiet; then
            echo "No engine change to commit."
            exit 0
          fi
          git config user.name "lnr-studio-bot"
          git config user.email "lnrstrokes@gmail.com"
          git add -A
          git commit -m "fix(timer): gate promo phases on the promo toggle" -m "Promo breaks are no longer scheduled, entered or kept on air while the toggle is off. The engine patch is applied by a small anchor script, which removes itself in this commit." -m "Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push
