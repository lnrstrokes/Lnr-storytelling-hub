name: Land LNR fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged patches and commit
        shell: bash
        run: |
          set -euo pipefail
          cat .github/lnr-fix.patch .github/lnr-fix-2.patch .github/lnr-fix-3.patch .github/lnr-fix-4.patch .github/lnr-fix-5.patch .github/lnr-fix-6.patch > /tmp/lnr.patch
          git apply --check --whitespace=nowarn /tmp/lnr.patch
          git apply --whitespace=nowarn /tmp/lnr.patch
          git config user.name "LNR Studio"
          git config user.email "actions@users.noreply.github.com"
          git rm -q .github/lnr-fix.patch .github/lnr-fix-2.patch .github/lnr-fix-3.patch .github/lnr-fix-4.patch .github/lnr-fix-5.patch .github/lnr-fix-6.patch .github/workflows/land-fixes.yml
          git add -A
          git commit -m "fix: Pro buttons open the Selar checkout, promo uploads blocked on Free, bare site host"
          git push origin HEAD:main
