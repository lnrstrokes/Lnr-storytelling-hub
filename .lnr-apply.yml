name: Apply livestream readiness fixes
on:
  push:
    branches: [main]
    paths: ['.lnr-apply.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          base64 -d .lnr-patch.b64 | gunzip > /tmp/fix.patch
          git apply --check -p1 /tmp/fix.patch
          git apply -p1 /tmp/fix.patch
          echo APPLIED_OK
      - name: Commit and push
        run: |
          set -e
          git config user.name "lnr-studio-bot"
          git config user.email "bot@lnrstrokes.local"
          rm -f .lnr-apply.yml .lnr-patch.b64 .push-access-check.md
          git add -A
          git commit -m "feat: natural speech prosody, premium stage design, MP3 playback fix, original upbeat show bed"
          git push origin HEAD:main
          echo PUSHED_OK
